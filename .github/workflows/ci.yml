name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Lint (ruff)
        run: uvx ruff check src/ scripts/ --select E,F,W --ignore E501 --fix

      - name: Type check (pyright)
        run: uv run pyright src/app/
        continue-on-error: true  # non-bloquant tant que les annotations sont incomplètes

      - name: Import check — festival RAG
        run: |
          cd src/app
          uv run python -c "
          from agent.tools import search_festival_store
          from load_festival.festival_to_vectorstore import _get_chroma_client
          print('Imports OK')
          "

      - name: Import check — recommandation
        run: uv run python -c "from src.api.main import app; print('Imports OK')"
